</head>


<body
data-page="contact"
data-division="systems">


<div id="header-placeholder"></div>


<main>


<section class="page-hero">

<div class="container">

<p class="hero__eyebrow">

We're Here To Help

</p>

<h1>

Contact Us

</h1>

<p>

Talk to our team about products,
technology and IT solutions.

</p>

</div>

</section>



<section class="section">

<div class="container">


<div class="contact-grid">


<!-- CONTACT INFORMATION -->

<div class="contact-info">


<h2>

Get In Touch

</h2>


<div class="contact-item">

<h3>
📞 Phone
</h3>

<a href="tel:+919846302700">

+91 98463 02700

</a>

</div>



<div class="contact-item">

<h3>
✉ Email
</h3>

<a href="mailto:grownupsystem@gmail.com">

grownupsystem@gmail.com

</a>

</div>



<div class="contact-item">

<h3>
📍 Location
</h3>

<p>

Kottakkal, Kerala, India

</p>

</div>



<a
href="https://wa.me/919846302700"
class="btn btn--primary"
target="_blank"
rel="noopener noreferrer">

Chat on WhatsApp

</a>


</div>



<!-- CONTACT FORM -->

<form
class="contact-form"
id="contactForm">


<h2>

Send Us A Message

</h2>


<div class="form-group">

<label for="name">

Your Name

</label>

<input
type="text"
id="name"
name="name"
required>

</div>



<div class="form-group">

<label for="phone">

Phone Number

</label>

<input
type="tel"
id="phone"
name="phone">

</div>



<div class="form-group">

<label for="email">

Email Address

</label>

<input
type="email"
id="email"
name="email">

</div>



<div class="form-group">

<label for="message">

Message

</label>

<textarea
id="message"
name="message"
rows="6"
required></textarea>

</div>



<button
type="submit"
class="btn btn--primary">

Send Message

</button>


<p
id="formMessage"
class="form-message">

</p>


</form>


</div>


</div>

</section>
