<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Gallery | Grown Up Systems</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/animations.css">

</head>


<body
data-page="gallery"
data-division="systems">


<div id="header-placeholder"></div>


<main>


<section class="page-hero">

<div class="container">

<p class="hero__eyebrow">

Grown Up Systems

</p>

<h1>

Gallery

</h1>

<p>

A look at our products,
technology solutions and work.

</p>

</div>

</section>



<section class="section">

<div class="container">


<!-- Gallery filters -->

<div
class="gallery-filters"
id="galleryFilters">

<button
type="button"
class="gallery-filter is-active"
data-filter="all">

All

</button>

<button
type="button"
class="gallery-filter"
data-filter="Store">

Store

</button>

<button
type="button"
class="gallery-filter"
data-filter="Products">

Products

</button>

<button
type="button"
class="gallery-filter"
data-filter="Power">

Power

</button>

<button
type="button"
class="gallery-filter"
data-filter="Solar">

Solar

</button>

</div>



<!-- Gallery -->

<div
class="gallery-grid"
id="galleryGrid">

<p class="placeholder-note">

Loading gallery...

</p>

</div>


<!-- Lightbox -->

<div
class="gallery-lightbox"
id="galleryLightbox"
hidden
aria-hidden="true">


<button
type="button"
class="gallery-lightbox__close"
id="galleryLightboxClose"
aria-label="Close image">

&times;

</button>


<button
type="button"
class="gallery-lightbox__prev"
id="galleryLightboxPrev"
aria-label="Previous image">

&#10094;

</button>


<div class="gallery-lightbox__content">

<img
id="galleryLightboxImage"
src=""
alt="">


<p
id="galleryLightboxCaption">
</p>

</div>


<button
type="button"
class="gallery-lightbox__next"
id="galleryLightboxNext"
aria-label="Next image">

&#10095;

</button>


</div>


</div>

</section>


</main>


<div id="footer-placeholder"></div>


<script src="js/includes.js" defer></script>
<script src="js/image-fallback.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/gallery.js" defer></script>
<script src="js/animations.js" defer></script>


</body>

</html>
