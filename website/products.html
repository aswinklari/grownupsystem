<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Products | Grown Up Systems</title>

<meta
name="description"
content="Browse printers, UPS systems, computers, networking equipment and accessories.">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/animations.css">
</head>


<body
data-page="products"
data-division="systems">


<div id="header-placeholder"></div>


<main>


<section class="page-hero">

<div class="container">

<p class="hero__eyebrow">
Grown Up Systems
</p>

<h1>
Our Products
</h1>

<p>
Explore our range of technology products
and IT solutions.
</p>

</div>

</section>



<section class="section">

<div class="container">


<div class="products-layout">


<!-- FILTERS -->

<aside class="product-filters">

<h3>
Filter Products
</h3>


<div class="filter-group">

<label for="categoryFilter">
Category
</label>

<select id="categoryFilter">

<option value="">
All Categories
</option>

</select>

</div>



<div class="filter-group">

<label for="brandFilter">
Brand
</label>

<select id="brandFilter">

<option value="">
All Brands
</option>

</select>

</div>


<button
type="button"
class="btn btn--secondary"
id="clearFilters">

Clear Filters

</button>


</aside>



<!-- PRODUCTS -->

<div class="products-content">


<div class="products-toolbar">

<p id="productCount">

Loading products...

</p>


<select id="sortProducts">

<option value="default">
Sort By
</option>

<option value="price-low">
Price: Low to High
</option>

<option value="price-high">
Price: High to Low
</option>

<option value="name">
Name
</option>

</select>


</div>



<div
class="product-grid"
id="productGrid">

<p class="placeholder-note">

Loading products...

</p>

</div>


</div>


</div>


</div>

</section>


</main>



<div id="footer-placeholder"></div>


<script src="js/includes.js" defer></script>
<script src="js/image-fallback.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/products.js" defer></script>
<script src="js/animations.js" defer></script>

</body>

</html>
